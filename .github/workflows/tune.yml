name: tune
on: [push, pull_request]

jobs:
  sweep-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      # The tests use stub_engine.py, so no GPU and no Strata build are needed.
      - run: python -m pytest test_bayesian_tune.py -q
